services:
    devcontainer:
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile
        volumes:
            - ..:/workspace:cached
        ports:
            - 3000:3000
        environment:
            - PUML_URL=http://plantuml-server:8080/plantuml
        depends_on:
            - plantuml-server
        command: sleep infinity

    plantuml-server:
        image: plantuml/plantuml-server:jetty-v1.2025.10
        ports:
            - 8080:8080
        environment:
            - BASE_URL=plantuml
