content/archive/: false

# Files and folders deleted on the release branch: internal, or not needed by the public version.
# Paths are relative to the repository root; a folder ends in "/".
exclude:
  - CHANGELOG.md        # changelog of the German Blueprint
  - CLA.docx            # contributor agreement of the German project
  - CONTRIBUTING.md     # contribution process of the German project
  - Dockerfile          # internal hosting
  - MODIFICATIONS.md    # internal change log; the in-file "RO modification" notes stay
  - .gitlab-ci.yml      # internal CI
  - .gitlab/            # internal issue templates and changelog configuration
  - .releaserc.json     # internal release pipeline; refers to CHANGELOG.md
  - cog.toml            # internal changelog tooling; refers to CHANGELOG.md
  - architecture-proposal/content/features/PID/german-pid-rulebook.md  # headings-only stub, not in the menu, German wording
# Published files must not refer to an excluded path; release:verify fails if one does.
